name: Test webhook

on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (offline, no secrets)
        working-directory: api/worker
        run: npm test
